name: Feature request
description: Propose a focused clipboard or local-memory workflow improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: Describe the user problem rather than only a proposed UI.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
    validations:
      required: true
  - type: dropdown
    id: permissions
    attributes:
      label: Does this appear to require a new macOS permission?
      options: ["No", Unsure, Accessibility, Input Monitoring, Automation, Screen Recording, Files and Folders, Other]
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Does this require network access?
      options: ["No", Unsure, "Yes"]
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
